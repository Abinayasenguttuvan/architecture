<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly Magazine - Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ================= GLOBAL ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;
overflow-y:auto;   /* ✅ enables scrolling */
background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
}
/* ================= WRAPPER ================= */
.wrapper{
  
min-height:650px;
height:auto;   /* ✅ allows content growth */

width:92%;
max-width:1100px;
height:650px;
display:flex;
border-radius:20px;
overflow:hidden;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

/* ================= LEFT ================= */
.left{
flex:1;
padding:25px;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
position:relative;
}

/* TOP BAR */
.top-bar{
position:absolute;
top:15px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
display:flex;
align-items:center;
gap:8px;
font-weight:600;
font-size:18px;
}

.logo i{
color:#ff6b35;
}
@media (max-width:768px){
body{
align-items:flex-start; /* important for scroll */
padding:20px 0;
}
}

.home-btn{
text-decoration:none;
color:#fff;
padding:6px 10px;
border-radius:6px;
background:rgba(255,255,255,0.1);
font-size:12px;
}

/* LOGIN */
.login-box{
margin-top:60px;
}

h1{
font-size:26px;
margin-bottom:5px;
}

h2{
font-size:13px;
opacity:0.8;
margin-bottom:20px;
}

.input-box{
margin:12px 0;
position:relative;
}

.input-box input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:8px;
background:rgba(255,255,255,0.15);
color:#fff;
}

.eye-icon{
position:absolute;
right:12px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#ff6b35;
color:#fff;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff4d1a;
transform:scale(1.02);
}

/* LINKS */
.links{
display:flex;
justify-content:space-between;
margin:10px 0;
font-size:12px;
}

.links a{
color:#fff;
text-decoration:none;
opacity:0.8;
cursor:pointer;
}

.links a:hover{
opacity:1;
}

/* ERROR */
#error{
color:#ffb3b3;
font-size:13px;
margin-top:8px;
}

/* SOCIAL */
.social{
margin-top:15px;
}

.social button{
margin:6px 0;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
font-weight:400;
}

/* ================= RIGHT ================= */
.right{
flex:1;
overflow:hidden;
position:relative;
}

.slider{
display:flex;
width:400%;
height:100%;
animation:slide 16s infinite;
}

.slider img{
width:100%;
height:100%;
object-fit:cover;
}

@keyframes slide{
0%{transform:translateX(0);}
25%{transform:translateX(-25%);}
50%{transform:translateX(-50%);}
75%{transform:translateX(-75%);}
100%{transform:translateX(0);}
}

.overlay{
position:absolute;
bottom:20px;
left:20px;
background:rgba(0,0,0,0.3);
padding:12px;
border-radius:10px;
color:#fff;
backdrop-filter:blur(10px);
}

/* ================= TABLET ================= */
@media (max-width: 1024px){
.wrapper{
width:95%;
height:600px;
}

.login-logo img{
width:90px;
}
}

/* ================= TABLET / SMALL LAPTOP ================= */
@media (max-width: 768px){

.wrapper{
flex-direction:column;
height:auto;
}

.left{
padding:20px;
}

.right{
height:260px;
}

.slider img{
height:260px;
}

.login-box{
margin-top:80px;
}

h1{
font-size:22px;
}

h2{
font-size:12px;
}

.login-logo img{
width:80px;
}
}

/* ================= MOBILE LARGE ================= */
@media (max-width: 600px){

.wrapper{
width:95%;
border-radius:15px;
}

.login-box{
margin-top:90px;
}

.top-bar{
flex-direction:row;
gap:10px;
}

.home-btn{
font-size:11px;
padding:5px 8px;
}

.logo{
font-size:15px;
}

.social button{
font-size:12px;
padding:10px;
}
}

/* ================= MOBILE SMALL ================= */
@media (max-width: 480px){

.wrapper{
width:100%;
height:auto;
border-radius:0;
}

.left{
padding:15px;
}

.login-box{
margin-top:100px;
}

h1{
font-size:20px;
}

h2{
font-size:11px;
}

.input-box input{
padding:10px;
font-size:13px;
}

button{
padding:10px;
font-size:13px;
}

.links{
flex-direction:column;
gap:5px;
}

.right{
height:200px;
}

.slider img{
height:200px;
}

.overlay{
font-size:12px;
padding:10px;
}

.login-logo img{
width:65px;
}
}
.login-logo img{
  width: 100px;   /* adjust size here */
  height: auto;
}

</style>
</head>

<body>

<div class="wrapper">

<!-- ================= LEFT ================= -->
<div class="left">

<div class="top-bar">

  <div class="login-logo">
    <img src="./white.webp" alt="Stackly Ride Logo">
</div>

<a href="index.html" class="home-btn">
<i class="fa fa-home"></i> Home
</a>

</div>

<div class="login-box">

<h1>Welcome Back</h1>
<h2>Login to Architecture Portal</h2>

<div class="input-box">
<input type="email" id="email" placeholder="Email">
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Password">
<i class="fa-solid fa-eye-slash eye-icon" onclick="togglePassword()"></i>
</div>

<div class="links">
<a onclick="goSignup()">Signup</a>
<a onclick="goForgot()">Forgot Password?</a>
</div>

<button onclick="login()">Login</button>

<p id="error"></p>

<!-- SOCIAL LOGIN -->
<div class="social">

<button onclick="socialLogin('google')">
<i class="fab fa-google"></i> Connect with Google
</button>

<button onclick="socialLogin('instagram')">
<i class="fab fa-instagram"></i> Connect with Instagram
</button>

<button onclick="socialLogin('apple')">
<i class="fab fa-apple"></i> Connect with Apple
</button>

</div>

</div>
</div>

<!-- ================= RIGHT ================= -->
<div class="right">

<div class="slider">
<img src="./archi.webp">
<img src="./archi1.webp">
<img src="./archi2.webp">
<img src="./archi5.webp">
</div>

<div class="overlay">
<h3>Modern Architecture Studio</h3>
<p>Designing future spaces with precision</p>
</div>

</div>

</div>

<script>

/* PASSWORD */
function togglePassword(){
let p=document.getElementById("password");
let i=document.querySelector(".eye-icon");

if(p.type==="password"){
p.type="text";
i.classList.add("fa-eye");
i.classList.remove("fa-eye-slash");
}else{
p.type="password";
i.classList.remove("fa-eye");
i.classList.add("fa-eye-slash");
}
}

/* LOGIN VALIDATION */
function login(){
let email=document.getElementById("email").value.trim();
let pass=document.getElementById("password").value.trim();
let error=document.getElementById("error");

if(email==="" || pass===""){
error.innerText="Please fill details correctly";
}else{
window.location.href="404.html";
}
}

/* SOCIAL LOGIN */
function socialLogin(type){
window.location.href="404.html";
}

/* LINKS */
function goSignup(){
window.location.href="signup.html";
}

function goForgot(){
window.location.href="forgot.html";
}

</script>

</body>
</html>
